name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: woodcert-auction
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Java 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: woodcert-auction/pom.xml

      - name: Run backend test suite
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp test

      - name: Verify Docker-backed production wiring test ran
        run: |
          report="target/surefire-reports/TEST-com.woodcert.auction.integration.ProductionRuntimeConfigurationIntegrationTest.xml"
          test -f "$report"
          grep -q 'tests="1"' "$report"
          grep -q 'errors="0"' "$report"
          grep -q 'failures="0"' "$report"
          grep -q 'skipped="0"' "$report"

      - name: Upload backend reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: woodcert-auction/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: woodcert-auction-fe
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: woodcert-auction-fe/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: woodcert-auction-fe
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.0.9
          run_install: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: woodcert-auction-fe/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-playwright-report
          path: |
            woodcert-auction-fe/playwright-report/
            woodcert-auction-fe/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deployment-validation:
    name: Deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Validate deployment script
        run: |
          bash -n scripts/deploy-production.sh
          shellcheck scripts/deploy-production.sh

      - name: Validate production Compose configuration
        run: |
          env_file="$RUNNER_TEMP/compose.env"
          cat > "$env_file" <<'EOF'
          APP_DOMAIN=woodauction.example
          BACKEND_HOST_PORT=8080
          FRONTEND_HOST_PORT=3000
          MYSQL_DATABASE=woodcert_auction
          MYSQL_USER=woodcert
          MYSQL_PASSWORD=ci-password
          MYSQL_ROOT_PASSWORD=ci-root-password
          REDIS_PASSWORD=ci-redis-password
          JWT_SECRET_KEY=ci-jwt-secret-key-that-is-long-enough-for-hs512-validation
          ADMIN_PASSWORD_HASH=ci-admin-hash
          APPRAISER_PASSWORD_HASH=ci-appraiser-hash
          SMTP_HOST=smtp.example.com
          SMTP_PORT=587
          SMTP_USERNAME=ci@example.com
          SMTP_PASSWORD=ci-smtp-password
          SMTP_FROM=ci@example.com
          CLOUDINARY_CLOUD_NAME=ci-cloud
          CLOUDINARY_API_KEY=ci-key
          CLOUDINARY_API_SECRET=ci-secret
          CLOUDINARY_BASE_FOLDER=woodcert/ci
          VNPAY_TMN_CODE=ci-tmn
          VNPAY_HASH_SECRET=ci-vnpay-secret
          VNPAY_PAY_URL=https://sandbox.example/pay
          VNPAY_API_URL=https://sandbox.example/api
          BACKEND_IMAGE=ghcr.io/duynguyen312004/woodcert-auction-backend:ci
          FRONTEND_IMAGE=ghcr.io/duynguyen312004/woodcert-auction-frontend:ci
          EOF
          docker compose --env-file "$env_file" -f docker-compose.prod.yml config --quiet

  docker-build:
    name: Docker build (${{ matrix.component }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./woodcert-auction
          - component: frontend
            context: ./woodcert-auction-fe
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image without publishing
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=ci-${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.component }}

  ci-gate:
    name: CI gate
    if: always()
    needs:
      - backend
      - frontend
      - frontend-e2e
      - deployment-validation
      - docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          E2E_RESULT: ${{ needs.frontend-e2e.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment-validation.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$FRONTEND_RESULT" = success
          test "$E2E_RESULT" = success
          test "$DEPLOYMENT_RESULT" = success
          test "$DOCKER_RESULT" = success
