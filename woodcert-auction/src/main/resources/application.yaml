server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-local.yml

  application:
    name: woodcert-auction

  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false

  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        "[format_sql]": true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          "[time_zone]": UTC

  sql:
    init:
      mode: always
      encoding: UTF-8

  task:
    scheduling:
      pool:
        size: ${SCHEDULING_POOL_SIZE:4}

  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:0}

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

jwt:
  secret-key: ${JWT_SECRET_KEY:}
  access-token-expiration: 900
  refresh-token-expiration: 604800

identity:
  location-seed:
    enabled: true
    api-url: https://provinces.open-api.vn/api/v1/?depth=3
  refresh-token-cleanup:
    enabled: true
    cron: "0 0 */6 * * *"
  email-verification:
    verification-link-base-url: ${EMAIL_VERIFICATION_LINK_BASE_URL:http://localhost:5173/auth/verify-email}
    from-address: ${EMAIL_VERIFICATION_FROM:no-reply@woodcert.local}
    subject: ${EMAIL_VERIFICATION_SUBJECT:Verify your WoodCert email}
    token-ttl-seconds: ${EMAIL_VERIFICATION_TOKEN_TTL_SECONDS:900}
    resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
  password-reset:
    reset-link-base-url: ${PASSWORD_RESET_LINK_BASE_URL:http://localhost:5173/auth/reset-password}
    from-address: ${PASSWORD_RESET_FROM:no-reply@woodcert.local}
    subject: ${PASSWORD_RESET_SUBJECT:Reset your WoodCert password}
    token-ttl-seconds: ${PASSWORD_RESET_TOKEN_TTL_SECONDS:900}
    request-cooldown-seconds: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:60}
  refresh-cookie:
    secure: ${REFRESH_COOKIE_SECURE:true}
    path: ${REFRESH_COOKIE_PATH:/api/v1/auth}
    max-age: ${REFRESH_COOKIE_MAX_AGE:604800}
    same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  secure: ${CLOUDINARY_SECURE:true}
  base-folder: ${CLOUDINARY_BASE_FOLDER:woodcert/dev}
  cleanup:
    enabled: ${CLOUDINARY_CLEANUP_ENABLED:true}
    cron: ${CLOUDINARY_CLEANUP_CRON:0 0 */6 * * *}
    stale-pending-hours: ${CLOUDINARY_CLEANUP_STALE_PENDING_HOURS:24}
    batch-size: ${CLOUDINARY_CLEANUP_BATCH_SIZE:20}
    max-delete-attempts: ${CLOUDINARY_CLEANUP_MAX_DELETE_ATTEMPTS:5}
  upload:
    avatar-max-bytes: ${CLOUDINARY_AVATAR_MAX_BYTES:5242880}
    image-max-bytes: ${CLOUDINARY_IMAGE_MAX_BYTES:10485760}
    video-max-bytes: ${CLOUDINARY_VIDEO_MAX_BYTES:104857600}

catalog:
  appraisal:
    claim-timeout: ${CATALOG_APPRAISAL_CLAIM_TIMEOUT:PT24H}

finance:
  wallet:
    operation:
      pending-timeout: ${FINANCE_WALLET_OPERATION_PENDING_TIMEOUT:PT5M}

auction:
  scheduler:
    enabled: ${AUCTION_SCHEDULER_ENABLED:true}
    activate-cron: ${AUCTION_SCHEDULER_ACTIVATE_CRON:*/5 * * * * *}
    close-cron: ${AUCTION_SCHEDULER_CLOSE_CRON:*/5 * * * * *}
    repair-cron: ${AUCTION_SCHEDULER_REPAIR_CRON:*/30 * * * * *}
    repair-batch-size: ${AUCTION_SCHEDULER_REPAIR_BATCH_SIZE:20}
  bidding:
    anti-sniper-threshold: ${AUCTION_ANTI_SNIPER_THRESHOLD:PT30S}
    anti-sniper-extension: ${AUCTION_ANTI_SNIPER_EXTENSION:PT60S}
  redis:
    state-retention-after-end: ${AUCTION_REDIS_STATE_RETENTION:PT24H}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:}
  return-url: ${VNPAY_RETURN_URL:}
  api-url: ${VNPAY_API_URL:}
  fe-return-url: ${VNPAY_FE_RETURN_URL:}
  confirm-on-return-enabled: ${VNPAY_CONFIRM_ON_RETURN_ENABLED:false}
