services:
  mysql-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis-cache:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./woodcert-auction
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql-db:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci
      DB_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?ADMIN_PASSWORD_HASH is required}
      APPRAISER_PASSWORD_HASH: ${APPRAISER_PASSWORD_HASH:?APPRAISER_PASSWORD_HASH is required}
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN is required}
      REFRESH_COOKIE_SECURE: "true"
      REFRESH_COOKIE_SAME_SITE: Lax
      EMAIL_VERIFICATION_LINK_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/auth/verify-email
      PASSWORD_RESET_LINK_BASE_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/auth/reset-password
      EMAIL_VERIFICATION_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      PASSWORD_RESET_FROM: ${SMTP_FROM:?SMTP_FROM is required}
      SPRING_MAIL_HOST: ${SMTP_HOST:?SMTP_HOST is required}
      SPRING_MAIL_PORT: ${SMTP_PORT:-587}
      SPRING_MAIL_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME is required}
      SPRING_MAIL_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD is required}
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "true"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "true"
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?CLOUDINARY_CLOUD_NAME is required}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?CLOUDINARY_API_KEY is required}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?CLOUDINARY_API_SECRET is required}
      CLOUDINARY_BASE_FOLDER: ${CLOUDINARY_BASE_FOLDER:-woodcert/prod}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:?VNPAY_TMN_CODE is required}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:?VNPAY_HASH_SECRET is required}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_API_URL: ${VNPAY_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_RETURN_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/api/v1/wallets/vnpay/return
      VNPAY_FE_RETURN_URL: https://${APP_DOMAIN:?APP_DOMAIN is required}/wallet/deposit/result
      VNPAY_CONFIRM_ON_RETURN_ENABLED: "true"
    ports:
      - "127.0.0.1:${BACKEND_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  frontend:
    build:
      context: ./woodcert-auction-fe
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_WS_BASE_URL: /ws-auction
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 6

volumes:
  mysql_data:
  redis_data:
